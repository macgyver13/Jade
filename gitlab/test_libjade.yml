.libjade_test_template:
  tags: [ ga ]
  dependencies: []
  before_script:
    - pushd /opt/esp/idf && . ./export.sh && popd
    - ./tools/switch_to.sh jade --dev --noradio
    - pip install -r pinserver/requirements.txt
    - pip install .
    - pip install pytest
    # test_sp_roundtrip.py loads the vendored libwally through ctypes, which needs
    # the autotools build - the libjade cmake build does not produce src/.libs.
    # --enable-export-all is required: contrib/sp_psbt_roundtrip.py calls the
    # secp256k1 silentpayments scanning symbols that libwally does not wrap.
    - pushd components/libwally-core/upstream
    - ./tools/autogen.sh
    - ./configure --enable-debug --enable-export-all --disable-swig-java --disable-swig-python
    - make -j4
    - popd

test_libjade:
  extends: .libjade_test_template
  stage: pre_test
  script:
    - ./libjade/make_libjade.sh Debug
    - export LD_LIBRARY_PATH=$PWD/build_linux/libjade
    - python ./test_jade.py --log CRITICAL --libjade
    - pytest -v -s --libjade tests

test_libjade_selfcheck:
  extends: .libjade_test_template
  stage: test
  script:
    - export ASAN_OPTIONS=symbolize=1,detect_leaks=0
    - export UBSAN_OPTIONS=print_stacktrace=1
    - export ASAN_SO=/usr/lib/gcc/x86_64-linux-gnu/13/libasan.so
    - export LD_LIBRARY_PATH=$PWD/build_linux/libjade
    - |-
      for f in libjade/selfcheck/*.c; do
        ./libjade/make_libjade.sh Sanitize -DSELFCHECK=$(basename ${f%.*})
        LD_PRELOAD=$ASAN_SO python ./jade_cli.py --device libjade selfcheck
      done

test_libjade_sanitize:
  extends: .libjade_test_template
  stage: test
  script:
    - ./libjade/make_libjade.sh Sanitize
    - export ASAN_OPTIONS=symbolize=1,detect_leaks=0
    - export UBSAN_OPTIONS=print_stacktrace=1
    - export ASAN_SO=/usr/lib/gcc/x86_64-linux-gnu/13/libasan.so
    - export LD_LIBRARY_PATH=$PWD/build_linux/libjade
    - export SOCKET_LINK=$PWD/tmp_socket
    - echo "----------------------- STANDARD TESTS ------------------------"
    - LD_PRELOAD=$ASAN_SO python ./test_jade.py --log CRITICAL --libjade
    - LD_PRELOAD=$ASAN_SO pytest -v --libjade tests/
    - echo "----------------------- NON-LEGACY TESTS ----------------------"
    - LD_PRELOAD=$ASAN_SO pytest -v --libjade --no-legacy-flow tests/rpc/test_sign_tx.py tests/rpc/test_multisig.py
    - echo "-----------------------   SERIAL TESTS   ----------------------"
    - LD_PRELOAD=$ASAN_SO setsid $PWD/build_linux/libjade/libjade_daemon --serialport $SOCKET_LINK >daemon.log 2>&1 &
    - DAEMON_PID=$!
    - LD_PRELOAD=$ASAN_SO python ./test_jade.py --log CRITICAL --serialport $SOCKET_LINK --serialtimeout 30
    - LD_PRELOAD=$ASAN_SO pytest -v --device $SOCKET_LINK tests/
    - kill -- -$DAEMON_PID
  artifacts:
    expire_in: 2 days
    name: libjade_serial_log
    paths:
    - daemon.log

test_libjade_coverage:
  extends: .libjade_test_template
  stage: test
  when: manual
  script:
    - ./libjade/make_libjade.sh Debug --coverage
    - ./libjade/coverage.sh clean
    - export LD_LIBRARY_PATH=$PWD/build_linux/libjade
    - python ./test_jade.py --log CRITICAL --libjade
    - pytest -v --libjade --no-legacy-flow tests/
    - ./libjade/coverage.sh
  artifacts:
    expire_in: 2 days
    name: libjade_coverage
    paths:
    - build_linux/lcov
